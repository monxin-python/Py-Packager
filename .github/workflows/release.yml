name: 构建并发布

# 推一个 v 开头的 tag 就会触发：
#   git tag v3.1.0
#   git push origin v3.1.0
on:
  push:
    tags:
      - "v*"

# gh release create 需要写权限
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 安装 PyInstaller
        run: pip install pyinstaller

      - name: 打包 exe
        run: pyinstaller --onefile --windowed --noconfirm --icon=assets/icon.ico --name=PyPackager-${{ github.ref_name }}-win64 Py打包工具.py

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" "dist/PyPackager-${{ github.ref_name }}-win64.exe" --title "${{ github.ref_name }}" --generate-notes
